project:
  type: website
  output-dir: docs
  # pre-render:  # This can be deleted if you are using the manually curated list of publications in publications.qmd
  #   - python xlsx_to_yml.py  # Automatically generate publications.yml from publications.xlsx

# Meta
description-meta: "Quarto Academic Website Template adapted by Dr. Gang He"
author-meta: "Dr. Gang He"

website:
  title: "Suhas D L"
  image: "https://suhasdl.github.io"
  description: "Quarto Academic Website Template adapted by Dr. Gang He"

  navbar:
    background: "#2b2b2b"  # You can change the background color here

    left:   # You can comment out all navigation items here if you just like to keep the index page only
      - text: Home
        href: index.qmd
      - text: About
        href: about.qmd
#      - text: Research  # Commented out temporarily, will edit later
      - text: Publications  # Manually curated list of publications
        href: publications.qmd
      - text: Contact
        href: contact.qmd
#      - text: Teaching # Comment the Teaching part out to remove the Teaching page
#        href: teaching.qmd
#        - text: Outreach
#          menu:
#          - text: Presentations
#           href: posts.qmd#category=presentation
#      - text: Group   # Comment the Group part out to remove the Group page
#        href: people.qmd

    right:
      - text: CV
        href: files/CV.pdf
      - icon: github
        href: https://github.com/suhasdl
        target: _blank

  page-navigation: true

  page-footer:
    left: "&copy; Suhas D L, <script>document.write(new Date().getFullYear())</script>"
    center: "Built on Quarto"

  search:
    location: navbar
    type: textbox

  reader-mode: true

  draft-mode: unlinked

  repo-url: https://github.com/drganghe/quarto-academic-website-template
#  repo-actions: [edit, issue, source]

  open-graph: true

  twitter-card: true
#  card-style: summary

  site-url: "https://drganghe.github.io/quarto-academic-website-template"

  google-analytics:
    tracking-id: ""  # Please delete or replace with your own tracking ID
    anonymize-ip: true

bibliography: references.bib  # Add references.bib to the root folder to enable the bibliography function

format:
  html:
    theme: lux
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/drganghe\.github\.io\/custom'
    include-in-header: "files/includes/_academic.qmd"
